<!doctype html><meta charset="utf-8"><title>Browser Use 本地实验</title><h1>学习主题</h1><label>筛选主题 <input id="filter"></label><ul><li>Nacos</li><li>OpenHands</li><li>Codex</li></ul><p id="count">3 个主题</p><script>document.querySelector('input').oninput=e=>{let n=0;document.querySelectorAll('li').forEach(li=>{li.hidden=!li.textContent.toLowerCase().includes(e.target.value.toLowerCase());if(!li.hidden)n++});document.querySelector('#count').textContent=n+' 个主题'}</script>
